name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
      MUJOCO_GL: egl
    steps:
      - uses: actions/checkout@v4
      - name: Checkout TulpaLang
        uses: actions/checkout@v4
        with:
          repository: LoQiseaking69/TulpaLang
          path: TulpaLang
          token: ${{ secrets.TULPA_REPO_TOKEN || github.token }}
        continue-on-error: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: TulpaLang
      - name: Build tulpa
        if: hashFiles('TulpaLang/Cargo.toml') != ''
        run: cd TulpaLang && cargo build --release && echo "TULPA_BIN=$PWD/target/release/tulpa" >> $GITHUB_ENV
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - run: pip install -r requirements.txt
      - run: pytest -q
