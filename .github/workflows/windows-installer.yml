name: windows-installer

# Builds the Windows installer, signs it with Microsoft Artifact Signing when configured, and
# publishes it to the GitHub Releases page.
#
#   * push a tag  v2.1.0            → build, sign, publish release "HermiSim 2.1.0"
#   * Actions ▸ windows-installer ▸ Run workflow
#       version  2.1.0, publish ✔    → same, the tag is created on the selected commit
#       publish ✘                    → build (and sign) only; installer is a workflow artifact
#
# Signing turns on automatically once these repository secrets exist (Settings ▸ Secrets and
# variables ▸ Actions); without them the installer is built unsigned:
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID   app registration with a federated
#                                                            credential for this repo (OIDC)
#   ARTIFACT_SIGNING_ENDPOINT   e.g. https://eus.codesigning.azure.net
#   ARTIFACT_SIGNING_ACCOUNT    Artifact Signing account name
#   ARTIFACT_SIGNING_PROFILE    certificate profile name
# See installer/windows/SIGNING.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 2.1.0)"
        required: true
        default: "2.1.2"
      publish:
        description: "Publish a GitHub release (creates tag v<version>)"
        type: boolean
        default: true
      prerelease:
        description: "Mark the release as a pre-release"
        type: boolean
        default: false

permissions:
  contents: write     # create the tag + release
  id-token: write     # OIDC login to Azure for Artifact Signing

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    env:
      SIGNING_CONFIGURED: ${{ secrets.AZURE_CLIENT_ID != '' && secrets.ARTIFACT_SIGNING_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout TulpaLang
        uses: actions/checkout@v4
        with:
          repository: LoQiseaking69/TulpaLang
          path: TulpaLang
          token: ${{ secrets.TULPA_REPO_TOKEN || github.token }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: TulpaLang
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-dotnet@v4     # the Artifact Signing dlib runs on .NET 8
        if: env.SIGNING_CONFIGURED == 'true'
        with:
          dotnet-version: "8.0.x"

      - name: Version
        id: v
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.version }}"
          if ("${{ github.ref_type }}" -eq "tag") { $v = "${{ github.ref_name }}".TrimStart("v") }
          if (-not $v) { throw "no version" }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "version must look like 2.1.0, got '$v'" }
          $publish = ("${{ github.ref_type }}" -eq "tag") -or ("${{ github.event.inputs.publish }}" -eq "true")
          "version=$v" >> $env:GITHUB_OUTPUT
          "publish=$($publish.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Azure login (OIDC) for Artifact Signing
        if: env.SIGNING_CONFIGURED == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build (and sign) installer
        shell: pwsh
        env:
          HERMISIM_SIGN: ${{ env.SIGNING_CONFIGURED == 'true' && '1' || '0' }}
          ARTIFACT_SIGNING_ENDPOINT: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_PROFILE: ${{ secrets.ARTIFACT_SIGNING_PROFILE }}
        run: |
          if ($env:HERMISIM_SIGN -ne "1") { Write-Warning "Artifact Signing secrets not set - building UNSIGNED" }
          installer\windows\build.ps1 -TulpaSrc TulpaLang -Version ${{ steps.v.outputs.version }}

      - name: Release notes
        if: steps.v.outputs.publish == 'true'
        shell: pwsh
        run: |
          $v = "${{ steps.v.outputs.version }}"
          $exe = Get-ChildItem dist\installer\HermiSim-Setup-*.exe | Select-Object -First 1
          $sha = (Get-Content "$($exe.FullName).sha256").Split(" ")[0]
          $sig = if ($env:SIGNING_CONFIGURED -eq "true") {
            "Signed with Microsoft Artifact Signing (Authenticode, RFC 3161 timestamp)."
          } else {
            "This build is **not code-signed**: Windows SmartScreen will show *Windows protected your PC*. Choose **More info → Run anyway**."
          }
          @"
          ## Install on Windows

          1. Download **$($exe.Name)** below.
          2. Run it. You can install for just you (no admin needed) or for everyone.
          3. Start **HermiSim** from the Start menu. Your projects live in ``Documents\HermiSim``.

          $sig

          SHA-256: ``$sha``

          The installer bundles the HermiSim IDE, MuJoCo and the Tulpa toolchain (``tulpa`` + ``std/``).
          Requires 64-bit Windows 10 1809 or later.
          "@ | Set-Content release-notes.md -Encoding utf8

      - name: Publish GitHub release
        if: steps.v.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: HermiSim ${{ steps.v.outputs.version }}
          body_path: release-notes.md
          generate_release_notes: true
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          make_latest: ${{ github.event.inputs.prerelease != 'true' }}
          fail_on_unmatched_files: true
          files: |
            dist/installer/HermiSim-Setup-*.exe
            dist/installer/HermiSim-Setup-*.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: HermiSim-Setup-${{ steps.v.outputs.version }}
          path: |
            dist/installer/*.exe
            dist/installer/*.sha256
